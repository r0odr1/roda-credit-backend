services:
  - type: web
    name: roda-credit-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn 'app:create_app()' --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
    envVars:
      - key: FLASK_APP
        value: run.py
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: SECRET_KEY
        generateValue: true
      - key: ANNUAL_INTEREST_RATE
        value: "0.18"
      - key: DATABASE_URL
        fromDatabase:
          name: roda-postgres
          property: connectionString
      - key: CORS_ORIGINS
        sync: false  # configurar manualmente con la URL del frontend desplegado

databases:
  - name: roda-postgres
    plan: free
    databaseName: roda_db
    user: roda_user
